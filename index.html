<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1622" />
    <!-- O sufixo de versão no nome dos ficheiros não é decoração: um favicon
         que fica no mesmo endereço para sempre é servido da cópia guardada do
         browser durante meses, e o desenho novo nunca chega a quem já visitou
         o site. Ao trocar o desenho, subir o número aqui, no manifest.json e
         no nome dos dois ficheiros. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-v4.svg" />
    <!-- O iOS não lê os ícones do manifest ao "Adicionar ao ecrã principal":
         sem esta tag, o Safari usa uma captura da própria página como ícone.
         O PNG é quadrado de propósito — o iOS aplica o seu próprio squircle e
         brilho por cima, e um ficheiro já arredondado ficaria cortado. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-v4.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Ecrã de arranque (splash): NÃO se declara aqui.
         O `apple-touch-startup-image` do Safari só é aceite quando a imagem
         tem exactamente as dimensões do ecrã do aparelho — obrigaria a uma
         imagem por modelo de iPhone (mais de vinte ficheiros) e continuaria a
         ser ignorado em qualquer modelo novo. Em vez disso:
         - hoje, no browser/PWA, o arranque usa o `background_color` do
           manifest (#0A1622) com o ícone por cima — a mesma marinha da chapa
           do ícone e da primeira tela, por isso não há salto de cor;
         - no empacotamento nativo (Etapa C), as duas imagens de
           `public/splash/` (clara e escura, 2732×2732, geradas por
           `npm run icones`) entram como ecrã de arranque, e aí sim o iOS
           escolhe a certa conforme o tema do aparelho. -->
    <!-- Não há `apple-mobile-web-app-capable` de propósito: mudaria o
         comportamento do "Adicionar ao ecrã principal" e o `display:
         standalone` do manifest já é lido pelo iOS desde a versão 16.4. -->
    <!-- Achado da auditoria de Performance & PWA: nenhum preconnect pros
         hosts do Firebase — a primeira chamada de auth/dados pagava DNS +
         TLS do zero. Só os três hosts que o app realmente usa (email/senha,
         sem OAuth por popup — authDomain não entra) e a base de dados desta
         conta, na região europe-west1 (databaseURL em services/firebase.ts). -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link
      rel="preconnect"
      href="https://finapp1-20d00-default-rtdb.europe-west1.firebasedatabase.app"
      crossorigin
    />
    <title>FinApp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
